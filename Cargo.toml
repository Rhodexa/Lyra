[workspace]
resolver = "2"
members = ["crates/lyra-*", "crates/plugins/*", "crates/plugins/*/editor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lyra-plugin = { path = "crates/lyra-plugin" }
lyra-dsp    = { path = "crates/lyra-dsp" }
lyra-catalog = { path = "crates/lyra-catalog" }
# The plugin kit: what an editor needs from Lyra (crates/lyra-kit).
lyra-kit = { path = "crates/lyra-kit" }
# One crate per built-in plugin family (see crates/plugins).
lyra-fluttersine = { path = "crates/plugins/fluttersine" }
lyra-chrysalis   = { path = "crates/plugins/chrysalis" }
lyra-drums       = { path = "crates/plugins/drums" }
lyra-synth       = { path = "crates/plugins/synth" }
lyra-sampler     = { path = "crates/plugins/sampler" }
lyra-effects     = { path = "crates/plugins/effects" }
# Editors live beside their plugin; the two synths share a frozen look.
lyra-shared-look        = { path = "crates/plugins/shared-look" }
lyra-fluttersine-editor = { path = "crates/plugins/fluttersine/editor" }
lyra-chrysalis-editor   = { path = "crates/plugins/chrysalis/editor" }
lyra-engine = { path = "crates/lyra-engine" }
lyra-model  = { path = "crates/lyra-model" }

# UI: immediate-mode, OpenGL (glow) backend only, to keep downloads small.
egui   = "=0.31.1"
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
# Audio device I/O (ALSA -> PipeWire on Fedora).
cpal = "0.15"
# Lock-free single-producer/single-consumer ring buffer: our "ISR <-> main loop FIFO".
rtrb = "0.3"
# Project files: plain, readable JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file dialogs through the desktop portal (KDE/GNOME), no GTK needed.
rfd = "0.18"
hound = "3.5"
claxon = "0.4"

# Audio code is unusable unoptimized; keep debug builds fast but debuggable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
