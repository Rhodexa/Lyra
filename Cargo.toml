[workspace]
resolver = "2"
members = [
    # Lyra itself.
    "crates/lyra-*",
    # Built-in plugins: each folder in plugins/ is one plugin (see plugins/README.md).
    "plugins/*/plugin",
    "plugins/*/editor",
    "plugins/shared-look",
    # Octavia's extra parts: its plugin-free engine and the command-line renderer.
    "plugins/octavia/core",
    "plugins/octavia/render",
]
# Plain `cargo run/build/test` = everything but Octavia's renderer, so `cargo run`
# still means Lyra. The renderer: `cargo octavia …` (.cargo/config.toml);
# `cargo test --workspace` tests it too.
default-members = [
    "crates/lyra-*",
    "plugins/*/plugin",
    "plugins/*/editor",
    "plugins/shared-look",
    "plugins/octavia/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lyra-plugin = { path = "crates/lyra-plugin" }
lyra-dsp    = { path = "crates/lyra-dsp" }
lyra-catalog = { path = "crates/lyra-catalog" }
# The plugin kit: what an editor needs from Lyra (crates/lyra-kit).
lyra-kit = { path = "crates/lyra-kit" }
# One crate per built-in plugin family (see plugins/).
lyra-fluttersine = { path = "plugins/fluttersine/plugin" }
lyra-chrysalis   = { path = "plugins/chrysalis/plugin" }
lyra-drums       = { path = "plugins/drums/plugin" }
lyra-synth       = { path = "plugins/synth/plugin" }
lyra-sampler     = { path = "plugins/sampler/plugin" }
lyra-effects     = { path = "plugins/effects/plugin" }
# Octavia: a plugin-free engine (core) that plugin/ adapts for Lyra.
octavia-core     = { path = "plugins/octavia/core" }
octavia-lyra     = { path = "plugins/octavia/plugin" }
octavia-editor   = { path = "plugins/octavia/editor" }
# Editors live beside their plugin; the two synths share a frozen look.
lyra-shared-look        = { path = "plugins/shared-look" }
lyra-fluttersine-editor = { path = "plugins/fluttersine/editor" }
lyra-chrysalis-editor   = { path = "plugins/chrysalis/editor" }
lyra-engine = { path = "crates/lyra-engine" }
lyra-model  = { path = "crates/lyra-model" }

# UI: immediate-mode, OpenGL (glow) backend only, to keep downloads small.
egui   = "=0.31.1"
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
# Audio device I/O (ALSA -> PipeWire on Fedora).
cpal = "0.15"
# Lock-free single-producer/single-consumer ring buffer: our "ISR <-> main loop FIFO".
rtrb = "0.3"
# Project files: plain, readable JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native file dialogs through the desktop portal (KDE/GNOME), no GTK needed.
rfd = "0.18"
hound = "3.5"
claxon = "0.4"
png = "0.18"

# Audio code is unusable unoptimized; keep debug builds fast but debuggable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
# Octavia's engine renders whole pieces in its tests; it always ran at 2.
[profile.dev.package.octavia-core]
opt-level = 2
[profile.dev.package.octavia-render]
opt-level = 2
