<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra • Chromatic Silicone Rack</title><style>
:root{color-scheme:dark;--bg:#1c2226;--panel:#252b30}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#c4ccc8;font:14px system-ui,sans-serif;padding:clamp(14px,4vw,40px)}main{max-width:900px;margin:auto}h1{font-size:22px;font-weight:650;margin:0 0 7px}p{color:#8d9b96;margin:0 0 24px;line-height:1.5}.panel{background:var(--panel);border-radius:18px;padding:clamp(16px,4vw,32px);margin-bottom:16px}h2{font-size:12px;letter-spacing:.12em;color:#aab8b1;text-transform:uppercase;font-weight:600;margin:0 0 15px}.rack{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}.key{--hi:#d5ffe7;--mid:#b7f3d3;--low:#90dbb8;--edge:#79c6a4;--rim:#779b89;appearance:none;aspect-ratio:1;border:0;padding:2px;border-radius:10px;background:#141414;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}.pad{display:block;width:100%;height:100%;padding:4px;border-radius:8px;background:linear-gradient(#494949,#383838 12%,#383838 88%,#292929);transition:background .1s}.face{position:relative;display:grid;place-items:center;width:100%;height:100%;border-radius:5px;overflow:hidden;background:#292929;color:#a3a69a;font:650 clamp(9px,1.7vw,13px) ui-monospace,monospace;letter-spacing:.02em}.light{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 85% 82% at 50% 49%,var(--hi) 0%,var(--mid) 38%,var(--low) 76%,var(--edge) 100%);transition:opacity .1s}.legend{position:relative;z-index:1}.key.on .pad{background:linear-gradient(to bottom,var(--rim),var(--edge) 12%,var(--edge) 88%,var(--rim))}.key.on .light{opacity:1}.key.on .face{color:#25302c}.key:focus-visible{outline:2px solid #b7f3d3;outline-offset:3px}.mint{--hi:#d5ffe7;--mid:#b7f3d3;--low:#90dbb8;--edge:#79c6a4;--rim:#648f7a}.cyan{--hi:#d8fbff;--mid:#b1edf4;--low:#82cfdc;--edge:#6ab5c4;--rim:#568895}.blue{--hi:#e0eaff;--mid:#bfcefb;--low:#91adeb;--edge:#7b94ce;--rim:#6176a3}.lavender{--hi:#f2e4ff;--mid:#dcc6fa;--low:#b9a0e7;--edge:#a28acb;--rim:#7d6a9e}.pink{--hi:#ffe5f2;--mid:#ffc5df;--low:#ed9fc3;--edge:#d485aa;--rim:#a36683}.peach{--hi:#ffeadc;--mid:#ffd0b4;--low:#eeab8d;--edge:#d48e76;--rim:#a66d5e}.amber{--hi:#fff2d3;--mid:#f5dba5;--low:#dfbd7b;--edge:#c3a068;--rim:#927a55}.lime{--hi:#efffd7;--mid:#d7f4b4;--low:#b3d989;--edge:#96bc72;--rim:#73915b}.colors{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin-top:10px;text-align:center;font-size:10px;color:#9baaa4}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.action{border:1px solid #43504d;border-radius:8px;background:#303a3c;color:#c6d3cd;padding:8px 13px;cursor:pointer}.action:hover{background:#3b4849}.hint{font-size:12px;color:#83918b;margin-top:13px}.compact{grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}.compact .key{border-radius:7px;padding:1.5px}.compact .pad{border-radius:5px;padding:2px}.compact .face{border-radius:3px}.compact .legend{font-size:10px}@media(max-width:620px){.rack{grid-template-columns:repeat(4,minmax(0,1fr))}.colors{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:8px}.compact{grid-template-columns:repeat(6,minmax(0,1fr))}.face{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main><h1>LYRA / Chromatic button rack</h1><p>Soft silicone, bright diffused color, zero gloss. Tap to toggle. All colors are independent and themeable.</p><section class="panel"><h2>Eight-color sampler</h2><div class="rack" id="sampler"></div><div class="colors" id="names"></div></section><section class="panel"><h2>Packed 24-button rack</h2><div class="rack compact" id="packed"></div><div class="controls"><button class="action" id="all">All on</button><button class="action" id="none">All off</button><button class="action" id="random">Randomize</button></div><div class="hint">Same 2px recess + illuminated bevel language as the approved Lyra toggles.</div></section></main><script>
const palette=['mint','cyan','blue','lavender','pink','peach','amber','lime'];const names=['Mint','Cyan','Blue','Lavender','Pink','Peach','Amber','Lime'];const make=(name,label,on)=>{const b=document.createElement('button');b.type='button';b.className='key '+name+(on?' on':'');b.setAttribute('aria-label',`${name} ${label}`);b.setAttribute('aria-pressed',String(on));b.innerHTML=`<span class="pad"><span class="face"><span class="light"></span><span class="legend">${label}</span></span></span>`;b.addEventListener('click',()=>toggle(b,!b.classList.contains('on')));return b};function toggle(b,on){b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))}const sampler=document.getElementById('sampler');palette.forEach((c,i)=>{sampler.append(make(c,String(i+1).padStart(2,'0'),true));const name=document.createElement('span');name.textContent=names[i];document.getElementById('names').append(name)});const packed=document.getElementById('packed');for(let i=0;i<24;i++)packed.append(make(palette[i%8],String(i+1).padStart(2,'0'),[0,1,4,8,11,14,16,19,22].includes(i)));document.getElementById('all').onclick=()=>document.querySelectorAll('.key').forEach(b=>toggle(b,true));document.getElementById('none').onclick=()=>document.querySelectorAll('.key').forEach(b=>toggle(b,false));document.getElementById('random').onclick=()=>document.querySelectorAll('.key').forEach(b=>toggle(b,Math.random()>.5));
</script></html>
