<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra · Knob studies</title><style>
:root{--chassis:#252b30;--socket:#12191c;--rubber:#343b3d;--ink:#b2bdb6;--accent:#a4c8b7}*{box-sizing:border-box}body{margin:0;background:#1b2227;color:#cbd3ce;font:14px system-ui;padding:24px}h1{font-size:20px;margin:0 0 8px}p{color:#9eaaa5;max-width:680px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:960px}.card{background:var(--chassis);border:1px solid #354044;border-radius:14px;padding:22px;text-align:center}.card h2{font-size:14px;margin:14px 0 4px}.card small{color:#98a6a0}.knob{display:block;margin:auto;touch-action:none;cursor:ns-resize;user-select:none}.knob:focus-visible{outline:2px solid var(--accent);border-radius:50%}.value{font-variant-numeric:tabular-nums;color:var(--ink);margin-top:10px}.hint{font-size:12px;margin-top:22px}button{font:inherit;color:inherit} </style><h1>Lyra · Knob studies, revision 2</h1><p>Matte, physical controls. Three distinct shapes, each with continuous and stepped behavior. Drag vertically or use arrow keys. The accent is restricted to a small marker, never a luminous arc.</p><main id="gallery"></main><p class="hint">Theme colors are CSS variables at the top. All geometry is editable SVG.</p><script>
const types=[{size:'Small',px:76,detail:'Compact encoder · inset notch'},{size:'Normal',px:112,detail:'Soft-touch cap · raised index'},{size:'Bigger',px:160,detail:'Wide instrument dial · calibrated base'}];const root=document.getElementById('gallery');
function point(r,a){let t=(a-90)*Math.PI/180;return [100+Math.cos(t)*r,100+Math.sin(t)*r]}
function shape(kind,stepped){let marks='';if(kind===2){for(let i=0;i<11;i++){let a=-135+i*27,[x1,y1]=point(83,a),[x2,y2]=point(i%5===0?94:90,a);marks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7e8c88" stroke-width="${i%5===0?3:1.5}" stroke-linecap="round"/>`}}if(stepped){marks='';for(let i=0;i<9;i++){let a=-135+i*33.75,[x,y]=point(kind===0?80:kind===1?85:89,a);marks+=`<circle cx="${x}" cy="${y}" r="${kind===0?2.7:3.2}" fill="#7e8c88"/>`}}let r=kind===0?56:kind===1?65:72;let cap=kind===0?48:kind===1?56:62;return `<circle cx="100" cy="100" r="${r+9}" fill="#12191c"/><circle cx="100" cy="100" r="${r+4}" fill="#1b2326" stroke="#465052" stroke-width="2"/>${marks}<circle cx="100" cy="100" r="${r}" fill="#30383b" stroke="#50595a" stroke-width="2"/><circle cx="100" cy="100" r="${cap}" fill="#383f40" stroke="#444e4e" stroke-width="1.5"/>${kind===2?'<circle cx="100" cy="100" r="53" fill="none" stroke="#414a4a" stroke-width="4"/>':''}<g class="rotor"><line x1="100" y1="${kind===0?66:kind===1?54:45}" x2="100" y2="${kind===0?77:kind===1?75:71}" stroke="${stepped?'#b9c4bc':'#a4c8b7'}" stroke-width="${kind===0?5:6}" stroke-linecap="round"/></g>`}
for(let k=0;k<3;k++)for(let stepped of [false,true]){let t=types[k],card=document.createElement('section');card.className='card';card.innerHTML=`<svg class="knob" role="slider" aria-label="${t.size} ${stepped?'stepped':'continuous'} knob" tabindex="0" aria-valuemin="0" aria-valuemax="${stepped?8:100}" viewBox="0 0 200 200" width="${t.px}" height="${t.px}">${shape(k,stepped)}</svg><h2>${t.size} · ${stepped?'Stepped':'Continuous'}</h2><small>${stepped?'9 discrete positions':t.detail}</small><div class="value">${stepped?'Position 5 / 9':'50%'}</div>`;root.append(card);let svg=card.querySelector('svg'),rotor=svg.querySelector('.rotor'),read=card.querySelector('.value'),v=stepped?4:50,start=0,initial=0;function render(){let fraction=v/(stepped?8:100),angle=-135+270*fraction;rotor.setAttribute('transform',`rotate(${angle} 100 100)`);read.textContent=stepped?`Position ${v+1} / 9`:`${Math.round(v)}%`;svg.setAttribute('aria-valuenow',v)}function set(n){v=Math.max(0,Math.min(stepped?8:100,stepped?Math.round(n):n));render()}svg.addEventListener('pointerdown',e=>{start=e.clientY;initial=v;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(svg.hasPointerCapture(e.pointerId))set(initial+(start-e.clientY)*(stepped?.08:.8))});svg.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();set(v+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)*(stepped?1:2))}});render()}
</script></html>
