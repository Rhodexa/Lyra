<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra — Rotary Knobs</title><style>
:root{color-scheme:dark;--chassis:#252b30;--mint:#a4c8b7;--track:#131a1d;--face:#343b3e;--ink:#171d1f}*{box-sizing:border-box}body{margin:0;background:#20262b;color:#c5d0cb;font:14px system-ui;padding:28px}.panel{max-width:850px;margin:auto;background:var(--chassis);padding:24px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.cell{display:flex;align-items:center;flex-direction:column;gap:10px;padding:16px 6px;border-radius:12px;background:#22292e}.cell small{color:#8e9d98}.knob{position:relative;width:var(--size);height:var(--size);border:0;padding:0;border-radius:50%;background:transparent;cursor:ns-resize;touch-action:none;outline-offset:5px}.knob svg{display:block;width:100%;height:100%;overflow:visible}.knob .rim{fill:#151b1e}.knob .body{fill:#343c3f;stroke:#465052;stroke-width:1.3}.knob .inner{fill:#30383b}.knob .track{fill:none;stroke:#111719;stroke-width:5;stroke-linecap:round}.knob .value{fill:none;stroke:var(--mint);stroke-width:4;stroke-linecap:round}.knob .marker{stroke:#c6ded2;stroke-width:4;stroke-linecap:round}.knob .ticks{stroke:#697975;stroke-width:1.4;stroke-linecap:round}.knob:focus-visible{outline:2px solid var(--mint)}.value-text{font-variant-numeric:tabular-nums;font-size:12px;color:#a5bbb1}h1{font-size:20px;margin:0 0 6px}p{color:#9eada7;margin:0 0 22px}.rowhead{grid-column:1/-1;color:#b7c8c0;font-weight:650;margin-top:8px}@media(max-width:540px){.grid{gap:8px}.cell{padding:12px 2px}.panel{padding:12px}}
</style><div class="panel"><h1>Lyra · Matte rotary controls</h1><p>Drag vertically or use arrow keys. Continuous knobs glide; stepped knobs snap. Three sizes, same material.</p><div class="grid" id="grid"></div></div><script>
const grid=document.querySelector('#grid');const sizes=[{name:'Small',px:64},{name:'Normal',px:94},{name:'Bigger',px:132}];const ns='http://www.w3.org/2000/svg';function polar(angle,r){let a=(angle-90)*Math.PI/180;return [50+r*Math.cos(a),50+r*Math.sin(a)]}function arc(a,b,r){const p=polar(a,r),q=polar(b,r);return `M ${p[0]} ${p[1]} A ${r} ${r} 0 ${b-a>180?1:0} 1 ${q[0]} ${q[1]}`}function draw(button,val,stepped){let angle=-135+val*270;const path=button.querySelector('.value'),marker=button.querySelector('.marker');path.setAttribute('d',arc(225,225+val*270,43));let p=polar(225+val*270,26),q=polar(225+val*270,36);marker.setAttribute('x1',p[0]);marker.setAttribute('y1',p[1]);marker.setAttribute('x2',q[0]);marker.setAttribute('y2',q[1]);button.parentElement.querySelector('.value-text').textContent=stepped?`${Math.round(val*8)+1} / 9`:`${Math.round(val*100)}%`;button.setAttribute('aria-valuenow',stepped?Math.round(val*8)+1:Math.round(val*100))}for(const stepped of [false,true]){let head=document.createElement('div');head.className='rowhead';head.textContent=stepped?'Stepped · 9 positions':'Continuous · smooth';grid.append(head);for(const s of sizes){let cell=document.createElement('div');cell.className='cell';let b=document.createElement('button');b.className='knob';b.style.setProperty('--size',s.px+'px');b.setAttribute('aria-label',`${s.name} ${stepped?'stepped':'continuous'} knob`);b.setAttribute('role','slider');b.setAttribute('aria-valuemin',stepped?'1':'0');b.setAttribute('aria-valuemax',stepped?'9':'100');b.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="rim" cx="50" cy="50" r="39"/><path class="track" d="${arc(225,495,43)}"/><path class="value"/><circle class="body" cx="50" cy="50" r="36"/><circle class="inner" cx="50" cy="50" r="29"/><line class="marker"/></svg>`;let label=document.createElement('small');label.textContent=s.name;let v=document.createElement('div');v.className='value-text';cell.append(b,label,v);grid.append(cell);let value=stepped?0.5:0.63;const update=x=>{value=Math.max(0,Math.min(1,stepped?Math.round(x*8)/8:x));draw(b,value,stepped)};update(value);let startY,startValue;b.addEventListener('pointerdown',e=>{startY=e.clientY;startValue=value;b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!b.hasPointerCapture(e.pointerId))return;update(startValue+(startY-e.clientY)/180)});b.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();update(e.key==='Home'?0:e.key==='End'?1:value+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)*(stepped?1/8:0.01))}})}}
</script></html>
