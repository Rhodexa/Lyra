<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra — Recess & Backlit LCD</title>
<style>
  :root {
    --chassis: #263039;
    --well: #151b20;
    --well-edge: #101519;
    --well-text: #c0c9c5;
    --accent: #8eaba4;
    --lcd-bg: #d5ddda;
    --lcd-ink: #27332f;
    --lcd-muted: #53635e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171d22; color: #c0c9c5; font-family: system-ui, sans-serif; }
  .panel { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 28px; padding: 32px; background: var(--chassis); border-radius: 14px; }
  .unit { display: grid; gap: 10px; justify-items: center; }
  .unit > label { font-size: 11px; letter-spacing: .12em; color: #9ba9a7; text-transform: uppercase; }
  /* Inset dropdown: dark well, flat face, no raised silicone bevel. */
  .recess-select { appearance: none; -webkit-appearance: none; min-width: 132px; border: 1px solid var(--well-edge); border-radius: 7px; padding: 10px 32px 10px 12px; color: var(--well-text); font: 500 13px system-ui, sans-serif; background: var(--well); box-shadow: inset 0 2px 4px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.035); cursor: pointer; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: ''; pointer-events: none; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.8px solid var(--accent); border-bottom: 1.8px solid var(--accent); transform: translateY(-70%) rotate(45deg); }
  .recess-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* White backlit monochrome LCD: softly rounded, flat, no gloss. */
  .lcd { display: grid; place-items: center; gap: 1px; min-width: 116px; min-height: 58px; padding: 9px 15px 8px; border-radius: 7px; background: var(--lcd-bg); color: var(--lcd-ink); box-shadow: inset 0 1px 2px rgba(25,35,30,.12); }
  .lcd-value { font: 650 21px/1.15 ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.06em; }
  .lcd-caption { font: 600 9px/1.2 system-ui, sans-serif; letter-spacing: .06em; color: var(--lcd-muted); }
</style>
</head>
<body>
  <main class="panel">
    <div class="unit">
      <label for="groove">Recessed dropdown</label>
      <div class="select-wrap">
        <select class="recess-select" id="groove">
          <option>Groove</option>
          <option>Straight</option>
          <option>Swing</option>
        </select>
      </div>
    </div>
    <div class="unit">
      <label>Backlit LCD</label>
      <div class="lcd" role="img" aria-label="Tempo 110.0 beats per minute">
        <div class="lcd-value">110.0</div>
        <div class="lcd-caption">BPM</div>
      </div>
    </div>
  </main>
</body>
</html>
