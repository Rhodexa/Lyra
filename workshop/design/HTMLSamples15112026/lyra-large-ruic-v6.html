<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra — Large RUIC v6</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c2226;color:#c4ccc8;font:14px system-ui,sans-serif}.panel{background:#252b30;border-radius:18px;padding:25px;max-width:440px;width:calc(100% - 24px);text-align:center}svg{display:block;width:100%;max-width:360px;margin:auto;touch-action:none;cursor:ns-resize;user-select:none}.row{display:flex;align-items:center;justify-content:space-between;margin:12px 20px;color:#a5b6ae}input{width:100%;accent-color:#9fc6b4}p{font-size:12px;color:#8d9a96;line-height:1.5}</style><div class="panel"><svg id="knob" viewBox="0 0 300 300" role="slider" aria-label="Large rotary knob" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68" tabindex="0"><defs><clipPath id="faceClip"><circle cx="150" cy="150" r="88"/></clipPath></defs><circle cx="150" cy="150" r="110" fill="#171d20"/><circle cx="150" cy="150" r="106" fill="#30383b"/><path id="track" fill="none" stroke="#171e21" stroke-width="7" stroke-linecap="round"/><path id="valueArc" fill="none" stroke="#9fc6b4" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="150" r="101" fill="#171d20"/><circle cx="150" cy="150" r="96" fill="#353d3f"/><g clip-path="url(#faceClip)"><rect x="62" y="62" width="88" height="88" fill="#41494b"/><rect x="150" y="62" width="88" height="88" fill="#474f51"/><rect x="62" y="150" width="88" height="88" fill="#474f51"/><rect x="150" y="150" width="88" height="88" fill="#41494b"/></g><g id="pointer"><rect x="145" y="60" width="10" height="32" rx="5" fill="#a3aca5"/></g></svg><div class="row"><span>0%</span><strong id="readout">68%</strong><span>100%</span></div><input id="range" type="range" min="0" max="100" value="68"><p>Fixed checkerboard lighting · recessed unlit arc · rotating unbordered pointer · drag, wheel or arrow keys</p></div><script>const knob=document.querySelector('#knob'),range=document.querySelector('#range'),pointer=document.querySelector('#pointer'),arc=document.querySelector('#valueArc'),track=document.querySelector('#track'),readout=document.querySelector('#readout');let value=68;const polar=(r,deg)=>{let a=deg*Math.PI/180;return [150+r*Math.sin(a),150-r*Math.cos(a)]};function path(from,to,r){let [x1,y1]=polar(r,from),[x2,y2]=polar(r,to);return `M${x1} ${y1} A${r} ${r} 0 ${Math.abs(to-from)>180?1:0} 1 ${x2} ${y2}`;}track.setAttribute('d',path(-135,135,125));function set(v){value=Math.max(0,Math.min(100,Math.round(v)));let a=-135+value*2.7;pointer.setAttribute('transform',`rotate(${a} 150 150)`);arc.setAttribute('d',value?path(-135,a,125):'');range.value=value;readout.textContent=value+'%';knob.setAttribute('aria-valuenow',value)}set(value);range.addEventListener('input',()=>set(+range.value));function fromPointer(e){let r=knob.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300-150,y=(e.clientY-r.top)/r.height*300-150;let a=Math.atan2(x,-y)*180/Math.PI;set((Math.max(-135,Math.min(135,a))+135)/2.7)}knob.addEventListener('pointerdown',e=>{knob.setPointerCapture(e.pointerId);fromPointer(e)});knob.addEventListener('pointermove',e=>{if(knob.hasPointerCapture(e.pointerId))fromPointer(e)});knob.addEventListener('wheel',e=>{e.preventDefault();set(value+(e.deltaY<0?1:-1))},{passive:false});knob.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();set(value+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1))}});</script></html>
