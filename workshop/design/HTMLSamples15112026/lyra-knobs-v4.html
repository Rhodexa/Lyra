<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra knobs — distinct families</title><style>:root{--panel:#252b30;--body:#343d3f;--mint:#a4c8b7;--muted:#526762}*{box-sizing:border-box}body{margin:0;background:#1d252a;color:#c6cecb;font:15px system-ui;padding:24px}h1{font-size:22px;font-weight:600}p{color:#9caeaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.tile{background:var(--panel);border-radius:20px;padding:20px;text-align:center}.tile h2{font-size:15px;font-weight:500;margin:0 0 10px}.knob{width:100%;height:210px;touch-action:none;cursor:ns-resize;user-select:none}.readout{color:#aabbb5;font-variant-numeric:tabular-nums}.note{font-size:12px}svg{overflow:visible}button{background:#344440;color:#d4e3db;border:0;border-radius:8px;padding:8px 12px}</style><h1>Lyra / rotary controls · v4</h1><p>Three different hardware families. Drag vertically, scroll, or use arrow keys. The selected detent lights up on stepped controls.</p><div class="grid" id="grid"></div><script>
const NS='http://www.w3.org/2000/svg',grid=document.getElementById('grid');const make=(tag,attrs={},parent)=>{let el=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));parent?.append(el);return el};
const defs=[['small','Flat utility'],['normal','Rubber cap'],['big','Wide instrument dial']];
function polar(r,a){let t=a*Math.PI/180;return [100+Math.sin(t)*r,100-Math.cos(t)*r]};function arc(r,a,b){let [x,y]=polar(r,a),[u,v]=polar(r,b);return `M${x} ${y} A${r} ${r} 0 ${b-a>180?1:0} 1 ${u} ${v}`}
for(let [family,name] of defs)for(let stepped of [false,true]){let value=stepped?4:.55;let tile=document.createElement('section');tile.className='tile';tile.innerHTML=`<h2>${name} · ${stepped?'Stepped':'Continuous'}</h2>`;let svg=make('svg',{viewBox:'0 0 200 200',class:'knob',role:'slider',tabindex:'0','aria-label':name+' '+(stepped?'stepped':'continuous'),'aria-valuemin':stepped?1:0,'aria-valuemax':stepped?9:100},tile);let read=document.createElement('div');read.className='readout';tile.append(read);grid.append(tile);
// Small is a genuinely flat disc; normal keeps the rubber rim; large is a broad horizontal grip dial.
if(family==='small'){make('circle',{cx:100,cy:100,r:56,fill:'#343d3f'},svg);make('circle',{cx:100,cy:100,r:48,fill:'#384143'},svg)}
if(family==='normal'){make('circle',{cx:100,cy:100,r:73,fill:'#151c1e'},svg);make('circle',{cx:100,cy:100,r:63,fill:'#363e40',stroke:'#586364','stroke-width':4},svg)}
if(family==='big'){make('circle',{cx:100,cy:100,r:88,fill:'#171d1f'},svg);make('circle',{cx:100,cy:100,r:79,fill:'#42494a'},svg);make('rect',{x:35,y:72,width:130,height:56,rx:24,fill:'#303839'},svg);make('path',{d:'M44 77 Q100 61 156 77',stroke:'#505b59','stroke-width':2,fill:'none'},svg)}
let track,active,dots=[],pointer;
if(!stepped){let r=family==='small'?68:family==='normal'?82:94;track=make('path',{d:arc(r,-135,135),stroke:'#394d4b','stroke-width':family==='small'?3:5,fill:'none','stroke-linecap':'round'},svg);active=make('path',{stroke:'#91b7a8','stroke-width':family==='small'?3:5,fill:'none','stroke-linecap':'round'},svg)}else{let r=family==='small'?72:family==='normal'?83:94;for(let i=0;i<9;i++){let [x,y]=polar(r,-135+i*270/8);dots.push(make('circle',{cx:x,cy:y,r:family==='small'?3:4,fill:'#536460'},svg))}}
pointer=make('line',{x1:100,y1:100,x2:100,y2:family==='small'?67:family==='normal'?52:38,stroke:'#a4c8b7','stroke-width':family==='big'?7:6,'stroke-linecap':'round'},svg);
function render(){let t=stepped?value/8:value;let angle=-135+t*270;pointer.setAttribute('transform',`rotate(${angle} 100 100)`);if(active)active.setAttribute('d',arc(family==='small'?68:family==='normal'?82:94,-135,Math.max(-134.9,angle)));dots.forEach((d,i)=>{d.setAttribute('fill',i===value?'#a4c8b7':'#536460');d.setAttribute('r',i===value?6:family==='small'?3:4)});read.textContent=stepped?`Position ${value+1} / 9`:`${Math.round(value*100)}%`;svg.setAttribute('aria-valuenow',stepped?value+1:Math.round(value*100))}render();let sy,sv;svg.addEventListener('pointerdown',e=>{sy=e.clientY;sv=value;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!svg.hasPointerCapture(e.pointerId))return;let delta=(sy-e.clientY)/150;value=stepped?Math.max(0,Math.min(8,Math.round(sv+delta*8))):Math.max(0,Math.min(1,sv+delta));render()});svg.addEventListener('wheel',e=>{e.preventDefault();value=stepped?Math.max(0,Math.min(8,value+(e.deltaY<0?1:-1))):Math.max(0,Math.min(1,value+(e.deltaY<0?.02:-.02)));render()},{passive:false});svg.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key))return;e.preventDefault();let dir=['ArrowUp','ArrowRight'].includes(e.key)?1:-1;value=stepped?Math.max(0,Math.min(8,value+dir)):Math.max(0,Math.min(1,value+dir*.01));render()})}
</script></html>
