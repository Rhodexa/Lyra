<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyra — Knob families</title><style>
:root{--chassis:#252b30;--well:#151b1e;--cap:#3b4345;--rim:#596162;--accent:#a4c8b7;--ink:#aeb8b5}*{box-sizing:border-box}body{margin:0;background:#1d2429;color:#c5cfcb;font:14px system-ui;padding:28px}.wrap{max-width:850px;margin:auto}h1{font-size:20px;font-weight:600}p{color:#9baaa5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.cell{background:var(--chassis);border-radius:13px;padding:20px 8px;text-align:center}.cell h2{font-size:13px;font-weight:600;margin:0 0 10px}.knob{display:block;touch-action:none;cursor:ns-resize;margin:auto;overflow:visible}.label{font-size:11px;color:#9caaa6;margin-top:8px}.value{font-variant-numeric:tabular-nums;color:#c2d1ca;font-size:12px;margin-top:4px}.hint{margin-top:22px;font-size:12px} @media(max-width:500px){body{padding:12px}.grid{gap:5px}.cell{padding:14px 2px}.knob{max-width:100%;height:auto}}
</style><div class="wrap"><h1>Lyra / knob suppliers</h1><p>Three distinct cap constructions. Drag up/down, use the mouse wheel, or arrow keys. The stepped dots are live positions.</p><div class="grid" id="grid"></div><p class="hint">Theme the controls with <code>--accent</code>, <code>--cap</code>, <code>--rim</code>, and <code>--chassis</code>. No filters, textures, or raster assets.</p></div><script>
const NS='http://www.w3.org/2000/svg',grid=document.getElementById('grid');
const defs=[{name:'Small / utility encoder',size:112,shape:'small'},{name:'Normal / rubber cap',size:132,shape:'normal'},{name:'Bigger / instrument dial',size:156,shape:'big'}];
function el(tag,attrs={},parent){let x=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,v);if(parent)parent.appendChild(x);return x}
function polar(r,a){let t=(a-90)*Math.PI/180;return [80+r*Math.cos(t),80+r*Math.sin(t)]}
function arc(r,a,b){let [x,y]=polar(r,a),[u,v]=polar(r,b);return `M${x} ${y} A${r} ${r} 0 ${b-a>180?1:0} 1 ${u} ${v}`}
function create(spec,stepped){let cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<h2>${spec.name}</h2>`;grid.append(cell);let svg=el('svg',{viewBox:'0 0 160 160',width:spec.size,height:spec.size,role:'slider',tabindex:'0','aria-label':`${spec.name}, ${stepped?'stepped':'continuous'}`,'aria-valuemin':0,'aria-valuemax':stepped?8:100},null);svg.classList.add('knob');cell.append(svg);let label=document.createElement('div');label.className='label';label.textContent=stepped?'Stepped · 9 positions':'Continuous';cell.append(label);let readout=document.createElement('div');readout.className='value';cell.append(readout);
let r=spec.shape==='small'?43:spec.shape==='normal'?53:62;
el('circle',{cx:80,cy:80,r:r+8,fill:'var(--well)'},svg);
let ticks=[];if(stepped){for(let i=0;i<9;i++){let [x,y]=polar(r+12,-130+i*260/8);ticks.push(el('circle',{cx:x,cy:y,r:spec.shape==='big'?3.3:2.9,fill:'#53615f'},svg))}}else{el('path',{d:arc(r+12,-130,130),fill:'none',stroke:'#3d4d4d','stroke-width':spec.shape==='small'?4:5,'stroke-linecap':'round'},svg);var active=el('path',{fill:'none',stroke:'var(--accent)','stroke-width':spec.shape==='small'?4:5,'stroke-linecap':'round'},svg)}
if(spec.shape==='small'){
 el('rect',{x:43,y:43,width:74,height:74,rx:17,fill:'var(--cap)',stroke:'var(--rim)','stroke-width':2},svg);
 el('rect',{x:49,y:49,width:62,height:62,rx:13,fill:'#363e40'},svg);
}else if(spec.shape==='normal'){
 el('circle',{cx:80,cy:80,r:50,fill:'var(--cap)',stroke:'var(--rim)','stroke-width':3},svg);
 el('circle',{cx:80,cy:80,r:41,fill:'#3a4243'},svg);
}else{
 el('circle',{cx:80,cy:80,r:58,fill:'#323b3e',stroke:'var(--rim)','stroke-width':3},svg);
 el('rect',{x:38,y:50,width:84,height:60,rx:21,fill:'var(--cap)'},svg);
}
let marker=el('line',{x1:80,y1:spec.shape==='big'?43:spec.shape==='normal'?43:51,x2:80,y2:spec.shape==='big'?59:spec.shape==='normal'?58:64,stroke:'var(--accent)','stroke-width':spec.shape==='small'?6:5,'stroke-linecap':'round'},svg);
let value=stepped?4:55;function draw(){let f=value/(stepped?8:100),a=-130+260*f;marker.setAttribute('transform',`rotate(${a} 80 80)`);if(stepped){ticks.forEach((t,i)=>{t.setAttribute('fill',i===value?'var(--accent)':'#53615f');t.setAttribute('r',i===value?4.6:2.9)})}else active.setAttribute('d',arc(r+12,-130,a===-130?-129.99:a));readout.textContent=stepped?`Position ${value+1} / 9`:`${Math.round(value)}%`;svg.setAttribute('aria-valuenow',value)}draw();function set(v){value=Math.max(0,Math.min(stepped?8:100,stepped?Math.round(v):v));draw()}
let startY,startValue;svg.addEventListener('pointerdown',e=>{startY=e.clientY;startValue=value;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(startY!==undefined)set(startValue+(startY-e.clientY)*(stepped?.075:.8))});function end(){startY=undefined}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('wheel',e=>{e.preventDefault();set(value+(e.deltaY<0?1:-1)*(stepped?1:3))},{passive:false});svg.addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();set(value+(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)*(stepped?1:2))}})}
for(let s of defs){create(s,false);create(s,true)}
</script></html>
