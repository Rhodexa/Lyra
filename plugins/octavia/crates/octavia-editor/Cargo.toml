[package]
name = "octavia-editor"
description = "Octavia's faceplate in Lyra: the plate, its controls and the performer's screen, in Octavia's own look."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# What an editor may know of Lyra: the kit (parameters with undo, telemetry,
# knob behaviour, live-reloaded artwork). From the Lyra repo next door; Lyra
# lists this crate in its own Cargo.toml by path.
lyra-kit = { path = "../../../../Lyra/crates/lyra-kit" }
lyra-plugin = { path = "../../../../Lyra/crates/lyra-plugin" }
# The parameter table, presets and the telemetry type.
octavia-lyra = { path = "../octavia-lyra" }
# Pure data and helpers: the snapshot, the instruments' strings and hand span.
octavia-core.workspace = true
# Must match Lyra's egui exactly (Lyra's Cargo.toml pins it).
egui = "=0.31.1"
