[package]
name = "octavia-editor"
description = "Octavia's faceplate in Lyra: the plate, its controls and the performer's screen, in Octavia's own look."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# What an editor may know of Lyra: the kit (parameters with undo, telemetry,
# knob behaviour, live-reloaded artwork).
lyra-kit.workspace = true
lyra-plugin.workspace = true
# The parameter table, presets and the telemetry type.
octavia-lyra.workspace = true
# Pure data and helpers: the snapshot, the instruments' strings and hand span.
octavia-core.workspace = true
# Lyra's pinned egui.
egui.workspace = true
